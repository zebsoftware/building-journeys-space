name: Build and code checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-build-only
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: placeholder-build-only
          SUPABASE_SERVICE_ROLE_KEY: placeholder-build-only
